events {
    worker_connections 1024;
}

http {
    include "E:/nginx-1.30.4/conf/mime.types";
    default_type application/octet-stream;

    server {
        listen 8081;
        server_name localhost;

        # Frontend static files (HTML, CSS, JS) จากโฟลเดอร์ AI
        root "E:/Year 3 , Team 1/Ai/Project/3AiWEB/3AiWEB/AI";
        index home.html index.html;

        # chat.py (พอร์ต 5002) — /chat, /chat/reset, /health
        location /chat {
            proxy_pass http://192.168.1.105:5002;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # timeout สูงเพราะ generate ภาพใช้เวลานาน
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # server.py (พอร์ต 5001) — /generate, /edit, /status, /outputs
        location /generate {
            proxy_pass http://192.168.1.105:5001;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /edit {
            proxy_pass http://192.168.1.105:5001;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /status {
            proxy_pass http://192.168.1.105:5001;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /outputs {
            proxy_pass http://192.168.1.105:5001;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://192.168.1.105:5002;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Serve frontend static files (fallback)
        location / {
            try_files $uri $uri/ /home.html;
        }
    }
}