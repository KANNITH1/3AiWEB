<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge AI - Image Engine</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        <!-- ===== แถบเมนูด้านข้าง (Sidebar) ===== -->
        <aside class="sidebar">
            <!-- โลโก้และชื่อเว็บ -->
            <div class="brand">
                <h1>Forge <span>AI</span></h1>
            </div>
            <!-- เมนูนำทางไปหน้าต่างๆ -->
            <nav class="nav-menu">
                <a href="home.html" class="nav-item active"><span class="icon">🎨</span><span>สร้างภาพ</span></a> <!-- [เมนูกด] รีโหลด/อยู่หน้าหลักสร้างภาพ (home.html) -->
                <a href="gallery.html" class="nav-item"><span class="icon">🖼️</span><span>แกลเลอรี่</span></a> <!-- [เมนูกด] นำทางไปหน้าแกลเลอรี่รูปภาพ (gallery.html) -->
            </nav>
            <!-- ข้อมูลโปรไฟล์ผู้ใช้และปุ่มออกจากระบบ -->
            <div class="user-profile">
                <div class="avatar-placeholder">--</div>
                <div class="user-info">
                    <span class="user-name">—</span>
                    <span class="user-id"></span>
                </div>
                <a href="#" onclick="logout(); return false;" class="logout-btn" title="ออกจากระบบ"> <!-- [ปุ่มกดยืนยัน] ออกจากระบบ ล้าง Token และนำทางไปหน้า index.html -->
                    <span class="icon">🚪</span>
                </a>
            </div>
        </aside>

        <!-- ===== พื้นที่ทำงานหลัก ===== -->
        <main class="main-content">
            <!-- หัวข้อหน้าเว็บ -->
            <header class="page-header">
                <span class="badge-subtitle">AI IMAGE ENGINE</span>
                <h2>AI Image <span class="highlight">Engine</span></h2>
                <p>เลือกโหมดที่ต้องการ แล้วปล่อยให้ Forge AI สร้างสรรค์ให้คุณ</p>
            </header>

            <div class="content-container">
                <!-- ===== แถบเลือกโหมดการทำงาน ===== -->
                <div class="mode-tabs" id="mode-selector">
                    <!-- โหมดสร้างภาพจากข้อความ -->
                    <button type="button" class="mode-tab active" data-mode="text2img"><span class="tab-icon">⚡</span> Text to Image</button> <!-- [ปุ่มเลือกโหมด] สลับไปใช้โหมดสร้างภาพจากข้อความ Prompt (Text to Image) -->
                    <!-- โหมดแปลงภาพจากภาพต้นฉบับ -->
                    <button type="button" class="mode-tab" data-mode="img2img"><span class="tab-icon">🖌️</span> Image to Image</button> <!-- [ปุ่มเลือกโหมด] สลับไปใช้โหมดแปลงรูปภาพตาม Prompt และรูปต้นฉบับ (Image to Image) -->
                    <!-- โหมดเบลอภาพ -->
                    <button type="button" class="mode-tab" data-mode="blur"><span class="tab-icon">💧</span> Blur</button> <!-- [ปุ่มเลือกโหมด] สลับไปใช้โหมดเบลอภาพด้วย OpenCV (Blur) -->
                    <!-- โหมดตรวจจับเส้นขอบภาพ -->
                    <button type="button" class="mode-tab" data-mode="canny"><span class="tab-icon">✏️</span> Canny</button> <!-- [ปุ่มเลือกโหมด] สลับไปใช้โหมดสกัดเส้นขอบด้วย OpenCV (Canny Edge) -->
                    <!-- โหมดตรวจจับวัตถุในภาพ -->
                    <button type="button" class="mode-tab" data-mode="detection"><span class="tab-icon">📦</span> Objects Detection</button> <!-- [ปุ่มเลือกโหมด] สลับไปใช้โหมดตรวจจับวัตถุในภาพด้วย MediaPipe (Objects Detection) -->
                </div>

                <div class="two-column-layout">
                    <!-- คอลัมน์ซ้าย: ฟอร์มตั้งค่าและสั่งประมวลผล -->
                    <div class="left-panel">
                        <!-- ===== ฟอร์มสร้างภาพและประมวลผล ===== -->
                    <div class="form-card">
                        <form id="generate-form">
                            <!-- ตัวเลือกโมเดล AI (ใช้ในโหมด Text to Image และ Image to Image) -->
                            <div class="form-group" id="group-model">
                                <label class="group-label">เลือกโมเดล (Base Model)</label>
                                <div class="btn-selector-group" id="model-selector">
                                    <button type="button" class="pill-btn model-btn active" data-value="sd_animagineXL40_v4Opt">sd_animagineXL40_v4Opt</button> <!-- [ปุ่มเลือกโมเดล] เลือกโมเดล sd_animagineXL40_v4Opt (อนิเมะ) สำหรับสร้างภาพ -->
                                    <button type="button" class="pill-btn model-btn" data-value="sd_manmaruMix_v30">sd_manmaruMix_v30</button> <!-- [ปุ่มเลือกโมเดล] เลือกโมเดล sd_manmaruMix_v30 สำหรับสร้างภาพ -->
                                </div>
                            </div>

                            <!-- ส่วนอัปโหลดรูปภาพต้นฉบับ (ใช้ในโหมด Image to Image, Blur, Canny, Objects Detection) -->
                            <div class="form-group" id="group-upload" style="display: none;">
                                <label class="group-label">อัปโหลดภาพต้นฉบับ</label>
                                <div class="upload-area" id="upload-area">
                                    <input type="file" id="source-image-input" accept="image/*" hidden> <!-- ตัวเลือกไฟล์: เปิดหน้าต่างเลือกไฟล์รูปภาพจากอุปกรณ์ผู้ใช้ -->
                                    <label for="source-image-input" class="upload-label" id="upload-label"> <!-- [ปุ่มคลิกอัปโหลด] กดเพื่อเลือกไฟล์รูปภาพจากอุปกรณ์ขึ้นมาประมวลผล -->
                                        <span class="upload-icon">📤</span>
                                        <span class="upload-text">คลิกเพื่ออัปโหลดรูปภาพที่นี่</span>
                                    </label>
                                    <div id="image-preview-container" style="display: none; position: relative; text-align: center;">
                                        <img id="source-image-preview" src="" alt="Preview">
                                        <button type="button" id="remove-image-btn" class="remove-btn">✕ ลบรูปภาพ</button> <!-- [ปุ่มกดยกเลิกภาพ] ลบรูปภาพต้นฉบับที่เลือกไว้และรีเซ็ตกล่องอัปโหลด -->
                                    </div>
                                </div>
                            </div>

                            <!-- ส่วนกรอกคำสั่ง Prompt (ใช้ในโหมด Text to Image และ Image to Image) -->
                            <div id="group-prompts">
                                <div class="form-group">
                                    <label for="prompt-input" class="group-label">Prompt (คำอธิบายภาพ)</label>
                                    <textarea id="prompt-input" rows="3" placeholder="เช่น a lone astronaut walking on a neon city street"></textarea>
                                </div>
                                <div class="form-group">
                                    <label for="negative-prompt-input" class="group-label">Negative Prompt (สิ่งที่ไม่ต้องการในภาพ)</label>
                                    <textarea id="negative-prompt-input" rows="2" placeholder="เช่น blurry, bad anatomy, low quality, text"></textarea>
                                </div>
                            </div>

                            <!-- ตั้งค่าระดับความเบลอ (เฉพาะโหมด Blur) -->
                            <div class="form-group" id="group-blur-strength" style="display: none;">
                                <label for="blur-input" class="group-label">Blur strength (ระดับความเบลอ)</label>
                                <input type="number" id="blur-input" value="15" min="1" max="100">
                            </div>

                            <!-- ตั้งค่าความแรงในการเปลี่ยนภาพ (เฉพาะโหมด Image to Image) -->
                            <div class="form-group" id="group-strength" style="display: none;">
                                <label class="group-label">ความแรงในการเปลี่ยนภาพ (Denoising Strength): <span id="strength-val">0.60</span></label>
                                <input type="range" id="strength-input" class="form-range" min="0.1" max="1.0" step="0.05" value="0.6" oninput="document.getElementById('strength-val').innerText = parseFloat(this.value).toFixed(2)" style="width: 100%;">
                            </div>

                            <!-- ตั้งค่าขอบเขตเส้นขอบ (เฉพาะโหมด Canny) -->
                            <div id="group-canny" style="display: none;">
                                <div style="display: flex; gap: 20px;">
                                    <div class="form-group" style="flex: 1;">
                                        <label for="canny-low" class="group-label">Threshold Low</label>
                                        <input type="number" id="canny-low" value="100">
                                    </div>
                                    <div class="form-group" style="flex: 1;">
                                        <label for="canny-high" class="group-label">Threshold High</label>
                                        <input type="number" id="canny-high" value="200">
                                    </div>
                                </div>
                            </div>

                            <!-- ตั้งค่าความแม่นยำในการตรวจจับวัตถุ (เฉพาะโหมด Objects Detection) -->
                            <div id="group-detection" style="display: none;">
                                <div class="form-group">
                                    <div style="display: flex; justify-content: space-between;">
                                        <label class="group-label">ความแม่นยำในการตรวจจับ (Score Threshold): <span id="score-threshold-val">0.50</span></label>
                                    </div>
                                    <input type="range" id="score-threshold-input" class="form-range" min="0.1" max="1.0" step="0.05" value="0.5" oninput="document.getElementById('score-threshold-val').innerText = parseFloat(this.value).toFixed(2)" style="width: 100%;">
                                </div>
                            </div>

                            <!-- ส่วนสุ่มและกำหนด Seed สำหรับควบคุมผลลัพธ์ภาพ -->
                            <div class="form-group" id="group-seed">
                                <label for="seed-input" class="group-label">Seed (ค่าคงที่สำหรับควบคุมภาพ)</label>
                                <div class="seed-input-wrapper" style="display: flex; gap: 10px;">
                                    <input type="number" id="seed-input" value="-1" placeholder="ใส่ -1 เพื่อสุ่มค่า" style="flex: 1; padding: 10px; border-radius: 12px; border: 1px solid var(--c-border); background: var(--c-bg);"> <!-- ช่องกรอกค่าคงที่ Seed สำหรับควบคุมผลลัพธ์ภาพ (-1 คือสุ่ม) -->
                                    <button type="button" id="random-seed-btn" class="secondary-btn">🎲 สุ่มใหม่</button> <!-- [ปุ่มกดสุ่ม] รีเซ็ตค่า Seed เป็น -1 เพื่อให้ระบบสุ่มภาพใหม่ -->
                                </div>
                            </div>

                            <!-- ปุ่มกดยืนยันเพื่อสั่งสร้างหรือประมวลผลภาพ -->
                            <button type="submit" id="submit-btn" class="primary-btn"> <!-- [ปุ่มกดยืนยันสั่งงาน] ส่งคำขอประมวลผลภาพไปยังเซิร์ฟเวอร์ Backend และแสดงผลลัพธ์ที่ฝั่งขวา -->
                                <span id="btn-text">สร้างภาพ</span>
                                <div id="btn-loader" class="loader" style="display: none;"></div>
                            </button>
                        </form>
                    </div>
                </div>

                <!-- คอลัมน์ขวา: ส่วนแสดงภาพผลลัพธ์ -->
                <div class="right-panel">
                    <!-- ===== ส่วนแสดงผลลัพธ์ภาพและปุ่มจัดการ ===== -->
                    <div id="result-container" class="form-card result-container" style="padding: 24px;">
                        <div class="image-box" style="position: relative; min-height: 450px; display: flex; align-items: center; justify-content: center; background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 20px; transition: 0.3s ease;">
                            <!-- ข้อความและไอคอนตอนยังไม่มีภาพผลลัพธ์หรือกำลังโหลด -->
                            <div id="placeholder-content" style="color: #94a3b8; display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 1;">
                                <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.6;">
                                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                  <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                  <polyline points="21 15 16 10 5 21"></polyline>
                                </svg>
                                <span id="placeholder-text" style="font-size: 15px; font-weight: 500; letter-spacing: 0.5px;">ภาพผลลัพธ์จะปรากฏที่นี่</span>
                            </div>
                            <!-- รูปภาพผลลัพธ์ที่ได้จาก AI -->
                            <img id="output-image" src="" alt="AI Generated Output" style="display: none; width: 100%; height: auto; max-height: 600px; object-fit: contain; position: relative; z-index: 2; border-radius: 18px;">
                            <!-- ปุ่มดาวน์โหลดภาพและปุ่มกดถูกใจเพื่อบันทึกลงแกลเลอรี่ -->
                            <div id="result-actions" style="display: none; gap: 12px; position: absolute; bottom: 20px; right: 20px; z-index: 3;">
                                <a id="download-btn" href="#" download="forge_ai_image.png" title="ดาวน์โหลดรูปลงเครื่อง" style="display: flex; width: 45px; height: 45px; border-radius: 50%; background: rgba(255,255,255,0.9); box-shadow: 0 4px 10px rgba(0,0,0,0.15); font-size: 20px; text-decoration: none; align-items: center; justify-content: center; transition: 0.2s ease;">📥</a> <!-- [ปุ่มดาวน์โหลด] คลิกเพื่อดาวน์โหลดไฟล์ภาพผลลัพธ์ลงเครื่องคอมพิวเตอร์ -->
                                <button type="button" id="like-btn" title="บันทึกลงแกลเลอรี่" style="display: flex; width: 45px; height: 45px; border-radius: 50%; border: none; background: rgba(255,255,255,0.9); box-shadow: 0 4px 10px rgba(0,0,0,0.15); font-size: 20px; cursor: pointer; transition: 0.2s ease; align-items: center; justify-content: center;">🤍</button> <!-- [ปุ่มกดถูกใจ] บันทึกภาพผลลัพธ์ไปยัง API: POST /api/gallery เพื่อเก็บไว้ในหน้า gallery.html -->
                            </div>
                        </div>
                        <!-- ข้อความแสดง Seed และผลการตรวจจับวัตถุ -->
                        <p class="seed-used-text" id="seed-display-text" style="display: none; margin-top: 15px;">Seed ที่ใช้: <span id="used-seed-display">-</span></p>
                        <p class="seed-used-text" id="detect-result-text" style="display: none; margin-top: 15px;"></p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <!-- ===== โหลดสคริปต์การทำงาน ===== -->
    <script src="config.js"></script> <!-- โหลดการตั้งค่า URL ของ Backend (config.js) -->
    <script src="script.js"></script> <!-- โหลดสคริปต์หลักควบคุมการทำงานของระบบ (script.js) -->
    <!-- โหลดโมดูล MediaPipe สำหรับตรวจจับวัตถุ -->
    <script>
        (function () {
            // ดึงไฟล์โมดูลตรวจจับวัตถุจาก Backend API
            const s = document.createElement('script');
            s.type = 'module';
            s.src = API_BASE + '/api/ai/object-detector-module.js'; // กำหนดที่อยู่สคริปต์โมดูลตรวจจับวัตถุจากเซิร์ฟเวอร์
            s.onerror = () => { window.__objectDetectorModuleFailed = true; }; // บันทึกสถานะกรณีโหลดโมดูลไม่สำเร็จ
            document.body.appendChild(s); // แทรกลงในเอกสารเพื่อเริ่มโหลดสคริปต์
        })();
    </script>
</body>
</html>
