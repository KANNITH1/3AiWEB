<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge AI - Image Engine</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <h1>Forge <span>AI</span></h1>
            </div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item"><span class="icon">📊</span><span>ภาพรวมระบบ</span></a>
                <a href="home.html" class="nav-item active"><span class="icon">🎨</span><span>สร้างภาพ</span></a>
                <a href="gallery.html" class="nav-item"><span class="icon">🖼️</span><span>แกลเลอรี่</span></a>
                <a href="about.html" class="nav-item"><span class="icon">ℹ️</span><span>เกี่ยวกับ</span></a>
            </nav>
            <div class="user-profile">
                <div class="avatar-placeholder">KP</div>
                <div class="user-info">
                    <span class="user-name">Kannithi Promtong</span>
                    <span class="user-id">Student ID: 6710301041</span>
                </div>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="main-content">
            <header class="page-header">
                <span class="badge-subtitle">AI IMAGE ENGINE</span>
                <h2>AI Image <span class="highlight">Engine</span></h2>
                <p>เลือกโหมดที่ต้องการ แล้วปล่อยให้ Forge AI สร้างสรรค์ให้คุณ</p>
            </header>

            <div class="content-container">
                <!-- Operation Modes -->
                <div class="mode-tabs" id="mode-selector">
                    <button type="button" class="mode-tab active" data-mode="text2img"><span class="tab-icon">⚡</span> Text to Image</button>
                    <button type="button" class="mode-tab" data-mode="img2img"><span class="tab-icon">🖌️</span> Image to Image</button>
                    <button type="button" class="mode-tab" data-mode="blur"><span class="tab-icon">💧</span> Blur</button>
                    <button type="button" class="mode-tab" data-mode="canny"><span class="tab-icon">✏️</span> Canny</button>
                    <button type="button" class="mode-tab" data-mode="detection"><span class="tab-icon">📦</span> Objects Detection</button>
                </div>

                <!-- Generation Form -->
                <div class="form-card">
                    <form id="generate-form">
                        
                        <!-- 1. ส่วนเลือก Model (โชว์ทุกโหมด ยกเว้น Canny/Detection ถ้าไม่ใช้ก็ซ่อนได้ใน script) -->
                        <div class="form-group" id="group-model">
                            <label class="group-label">เลือกโมเดล (Base Model)</label>
                            <div class="btn-selector-group" id="model-selector">
                                <button type="button" class="pill-btn model-btn active" data-value="sd_counterfeitV30_v30">sd_counterfeitV30_v30</button>
                                <button type="button" class="pill-btn model-btn" data-value="sd_manmaruMix_v30">sd_manmaruMix_v30</button>
                                <button type="button" class="pill-btn model-btn" data-value="sd_animagineXL40_v4Opt">sd_animagineXL40_v4Opt</button>
                                <button type="button" class="pill-btn model-btn" data-value="sd_AnythingXL_xl">sd_AnythingXL_xl</button>
                            </div>
                        </div>

                        <!-- 2. ส่วนเลือก LoRA (ซ่อนในโหมด Blur, Canny, Detection) -->
                        <div class="form-group" id="group-lora">
                            <label class="group-label">เลือก LoRA (Style Adjuster)</label>
                            <div class="btn-selector-group" id="lora-selector">
                                <button type="button" class="pill-btn lora-btn active" data-value="none">ไม่ใช้ LoRA</button>
                                <button type="button" class="pill-btn lora-btn" data-value="detail_tweaker">Detail Tweaker</button>
                                <button type="button" class="pill-btn lora-btn" data-value="anime_lineart">Anime Lineart</button>
                                <button type="button" class="pill-btn lora-btn" data-value="flat_colour">Flat Colour</button>
                            </div>
                        </div>

                        <!-- 3. ส่วนอัปโหลดรูปภาพ (ซ่อนใน Text to Image, โชว์ในโหมดอื่นๆ) -->
                        <div class="form-group" id="group-upload" style="display: none;">
                            <label class="group-label">อัปโหลดภาพต้นฉบับ</label>
                            <div class="upload-area" id="upload-area">
                                <input type="file" id="source-image-input" accept="image/*" hidden>
                                <label for="source-image-input" class="upload-label" id="upload-label">
                                    <span class="upload-icon">📤</span>
                                    <span class="upload-text">คลิกเพื่ออัปโหลดรูปภาพที่นี่</span>
                                </label>
                                <div id="image-preview-container" style="display: none; position: relative; text-align: center;">
                                    <img id="source-image-preview" src="" alt="Preview">
                                    <button type="button" id="remove-image-btn" class="remove-btn">✕ ลบรูปภาพ</button>
                                </div>
                            </div>
                        </div>

                        <!-- 4. ส่วน Prompt และ Negative Prompt (ซ่อนในโหมด Blur, Canny, Detection) -->
                        <div id="group-prompts">
                            <div class="form-group">
                                <label for="prompt-input" class="group-label">Prompt (คำอธิบายภาพ)</label>
                                <textarea id="prompt-input" rows="3" placeholder="เช่น a lone astronaut walking on a neon city street"></textarea>
                            </div>
                            <div class="form-group">
                                <label for="negative-prompt-input" class="group-label">Negative Prompt (สิ่งที่ไม่ต้องการในภาพ)</label>
                                <textarea id="negative-prompt-input" rows="2" placeholder="เช่น blurry, bad anatomy, low quality, text"></textarea>
                            </div>
                        </div>

                        <!-- 5. ส่วน Blur Strength (โชว์เฉพาะโหมด Blur) -->
                        <div class="form-group" id="group-blur-strength" style="display: none;">
                            <label for="blur-input" class="group-label">Blur strength (ระดับความเบลอ)</label>
                            <input type="number" id="blur-input" value="15" min="1" max="100">
                        </div>

                        <!-- 6. ส่วน Seed (ซ่อนในโหมด Blur, Canny, Detection) -->
                        <div class="form-group" id="group-seed">
                            <label for="seed-input" class="group-label">Seed (ค่าคงที่สำหรับควบคุมภาพ)</label>
                            <div class="seed-input-wrapper">
                                <input type="number" id="seed-input" value="-1" placeholder="ใส่ -1 เพื่อสุ่มค่า">
                                <button type="button" id="random-seed-btn" class="secondary-btn">🎲 สุ่มใหม่ (-1)</button>
                            </div>
                        </div>

                        <button type="submit" id="submit-btn" class="primary-btn">
                            <span id="btn-text">สร้างภาพ</span>
                            <div id="btn-loader" class="loader" style="display: none;"></div>
                        </button>
                    </form>

                    <!-- Result Output -->
                    <div id="result-container" class="result-container" style="display: none;">
                        <h3>ผลลัพธ์ภาพที่ได้</h3>
                        <div class="image-box">
                            <img id="output-image" src="" alt="AI Generated Output">
                        </div>
                        <p class="seed-used-text" id="seed-display-text">Seed ที่ใช้: <span id="used-seed-display">-</span></p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
