<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก - Forge AI</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-layout { display: flex; justify-content: center; align-items: center; min-height: 100vh; width: 100%; padding: 20px; background: var(--c-bg); }
    .auth-card { width: 100%; max-width: 420px; text-align: center; }
    .brand { margin-bottom: 10px; }
    .brand h1 { font-size: 36px; font-weight: 700; color: var(--primary); }
    .brand h1 span { color: #f97316; }
    .auth-footer { margin-top: 25px; font-size: 14px; color: var(--c-text-mut); text-align: center; }
    .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 600; transition: 0.2s; }
    .auth-footer a:hover { color: #ea580c; }
  </style>
</head>
<body>

  <div class="auth-layout">
    <div class="form-card auth-card">
      <div class="brand">
          <h1>Forge <span>AI</span></h1>
      </div>
      <h2 style="margin-bottom: 8px; font-size: 24px; font-weight: 600;">สมัครสมาชิก</h2>
      <p style="margin-bottom: 24px; color: var(--c-text-mut); font-size: 14px;">สร้างบัญชีใหม่เพื่อเริ่มใช้งาน</p>

      <form id="register-form" onsubmit="handleRegister(event)" style="text-align: left;">
        <div class="form-group">
          <label for="username" class="group-label">ชื่อผู้ใช้ (Username)</label>
          <input type="text" id="username" placeholder="ชื่อของคุณ" required>
        </div>

        <div class="form-group">
          <label for="email" class="group-label">อีเมล (Email)</label>
          <input type="email" id="email" placeholder="your@email.com" required>
        </div>

        <div class="form-group">
          <label for="password" class="group-label">รหัสผ่าน (Password)</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="primary-btn" style="margin-top: 10px;">
          ลงทะเบียน
        </button>
      </form>

      <div class="auth-footer">
        มีบัญชีอยู่แล้วใช่ไหม? <a href="index.html">เข้าสู่ระบบ</a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    function handleRegister(e) {
      e.preventDefault(); 
      alert('สมัครสมาชิกสำเร็จ! กรุณาเข้าสู่ระบบ');
      window.location.href = 'index.html'; 
    }
  </script>
</body>
</html>
