<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก — Forge AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== กล่องฟอร์มสมัครสมาชิก ===== -->
  <div class="auth-layout">
    <div class="form-card auth-card">
      <!-- โลโก้และชื่อระบบ -->
      <div class="brand">
          <h1>Forge <span>AI</span></h1>
      </div>
      <!-- หัวข้อหน้าสมัครสมาชิก -->
      <h2 style="margin-bottom: 8px; font-size: 24px; font-weight: 600;">สมัครสมาชิก</h2>
      <p style="margin-bottom: 24px; color: var(--c-text-mut); font-size: 14px;">สร้างบัญชีใหม่เพื่อเริ่มใช้งาน</p>

      <!-- ฟอร์มกรอกข้อมูลลงทะเบียน -->
      <form id="register-form" onsubmit="handleRegister(event)" style="text-align: left;">
        <!-- ช่องกรอกชื่อผู้ใช้ -->
        <div class="form-group">
          <label for="username" class="group-label">ชื่อผู้ใช้ (Username)</label>
          <input type="text" id="username" placeholder="ชื่อของคุณ" required>
        </div>

        <!-- ช่องกรอกอีเมล -->
        <div class="form-group">
          <label for="email" class="group-label">อีเมล (Email)</label>
          <input type="email" id="email" placeholder="your@email.com" required>
        </div>

        <!-- ช่องกรอกรหัสผ่าน -->
        <div class="form-group">
          <label for="password" class="group-label">รหัสผ่าน (Password)</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <!-- ปุ่มกดเพื่อลงทะเบียน -->
        <button type="submit" class="primary-btn" style="margin-top: 10px;">
          ลงทะเบียน
        </button>
      </form>

      <!-- ลิงก์สลับไปหน้าเข้าสู่ระบบ -->
      <div class="auth-footer">
        มีบัญชีอยู่แล้วใช่ไหม? <a href="index.html">เข้าสู่ระบบ</a>
      </div>
    </div>
  </div>

  <!-- ===== สคริปต์เชื่อมต่อ Backend สำหรับสมัครสมาชิก ===== -->
  <script src="config.js"></script>
  <script>
    // ฟังก์ชันย่อสำหรับดึง Element ตาม id
    const $ = id => document.getElementById(id);

    // ส่งข้อมูลสมัครสมาชิกไป Backend สำเร็จแล้วจะพาไปหน้าเข้าสู่ระบบ
    async function handleRegister(e) {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        const res = await fetch(API_BASE + '/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: $('username').value, email: $('email').value, password: $('password').value })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'สมัครสมาชิกไม่สำเร็จ');
        alert('สมัครสมาชิกสำเร็จ! กรุณาเข้าสู่ระบบ');
        window.location.href = 'index.html';
      } catch (err) {
        // แจ้งเตือนข้อผิดพลาด (เช่น เซิร์ฟเวอร์ปิดอยู่ หรืออีเมลซ้ำ)
        alert(err instanceof TypeError ? 'ไม่สามารถเชื่อมต่อ Backend ได้ (server.py ปิดอยู่)' : err.message);
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
