events {
    worker_connections 1024;
}

http {
    include E:/nginx-1.30.4/conf/mime.types;
    default_type application/octet-stream;

    server {
        listen 8080;
        server_name localhost;

        # ภาพถูกส่งเป็น base64 (img2img / บันทึกแกลเลอรี่) ใหญ่กว่า 1MB ที่เป็นค่า default ของ Nginx
        # ถ้าไม่ตั้งจะได้ error 413 Request Entity Too Large
        client_max_body_size 100m;

        # Frontend static files.
           E:\Year 3 , Team 1\Ai\Project\3AiWEB\3AiWEB\frontend;
        index index.html;

        # Backend API reverse proxy -> server.py (พอร์ต 5000)
        # Change 192.168.1.20 to the actual Backend machine IP when needed.
        # สำคัญ: ห้ามใส่ "/" ท้าย proxy_pass ไม่งั้น Nginx จะตัด /api/ ออกจาก path
        # (/api/login จะกลายเป็น /login แล้ว server.py หาไม่เจอ -> 404)
        location /api/ {
            proxy_pass http://192.168.1.20:5000;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ตั้งค่า Timeout เผื่อ AI ใช้เวลาเจนรูปนาน ป้องกัน Error 504
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }

        # Serve the frontend application.
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
