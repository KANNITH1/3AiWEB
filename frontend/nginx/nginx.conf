events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # 1. เสิร์ฟหน้าเว็บ Frontend (ใส่ Path เครื่องคุณให้ถูกต้อง)
        location / {
            root "E:/Year 3 , Team 1/Ai/Project/3AiWEB/3AiWEB/frontend"; 
            index index.html;
        }

        # 2. ส่งต่อคำสั่ง (Reverse Proxy) ไปให้ Backend ของเพื่อน
        location /api/ {
            # เปลี่ยน IP ด้านล่างเป็นเครื่องเพื่อนตอนทดสอบรวมระบบ
            proxy_pass http://192.168.1.20:5000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}