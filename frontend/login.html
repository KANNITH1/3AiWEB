<!--
  ==========================================
  login.html - หน้าเข้าสู่ระบบและสมัครสมาชิก
  ==========================================
  หน้าที่: ให้ผู้ใช้ Sign In หรือ Register ในหน้าเดียว
  ต้อง login ก่อนเข้าใช้งาน: ไม่ต้อง
  ใช้ไฟล์ JS: shared.js (UI helpers), auth.js (validation/auth/submit)
  ==========================================
-->
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - Forge AI</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
</head>
<body class="auth-page">
  <!-- พื้นหลังตกแต่งของหน้า authentication -->
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <main class="auth-shell">
    <a href="index.html" class="logo">Forge <span class="grad-text">AI</span></a>

    <section class="auth-card" aria-labelledby="auth-title">
      <!-- ข้อความแนะนำระบบและ visual ของหน้า auth -->
      <div class="auth-copy">
        <p class="eyebrow">WELCOME TO FORGE AI</p>
        <h1 id="auth-title">สร้างภาพที่เป็น <span class="grad-text">คุณ</span></h1>
        <p>เข้าสู่ระบบเพื่อเริ่มสร้าง เก็บ และจัดการผลงานของคุณ</p>
        <div class="auth-art">✦<span>NEURAL<br>CANVAS</span></div>
      </div>

      <div class="auth-form-wrap">
        <!-- แท็บสลับฟอร์ม ควบคุมโดย setAuthMode() ใน auth.js -->
        <div class="auth-tabs" role="tablist">
          <button
            class="auth-tab active"
            type="button"
            data-auth-tab="login"
            role="tab"
            aria-selected="true"
          >
            เข้าสู่ระบบ
          </button>
          <button
            class="auth-tab"
            type="button"
            data-auth-tab="register"
            role="tab"
            aria-selected="false"
          >
            สมัครสมาชิก
          </button>
        </div>

        <!-- ฟอร์ม Sign In: auth.js ตรวจ email/password และเรียก login() -->
        <form id="login-form" class="auth-form" novalidate>
          <h2>ยินดีต้อนรับกลับ</h2>
          <label for="login-email">อีเมล</label>
          <input id="login-email" name="email" type="email" autocomplete="email" required>
          <label for="login-password">รหัสผ่าน</label>
          <input id="login-password" name="password" type="password" minlength="6" autocomplete="current-password" required>
          <div class="form-row">
            <label class="checkbox">
              <input id="remember-me" type="checkbox">
              Remember Me
            </label>
            <a href="forgot-password.html">Forgot Password?</a>
          </div>
          <p class="form-message" id="login-message" role="alert"></p>
          <button class="btn-primary" type="submit">
            <span class="btn-text">เข้าสู่ระบบ</span>
          </button>
        </form>

        <!-- ฟอร์ม Register: auth.js ตรวจข้อมูลและเรียก register() -->
        <form id="register-form" class="auth-form" hidden novalidate>
          <h2>เริ่มต้นใช้งาน</h2>
          <label for="reg-email">อีเมล</label>
          <input id="reg-email" name="email" type="email" autocomplete="email" required>
          <label for="reg-username">ชื่อผู้ใช้</label>
          <input id="reg-username" name="username" type="text" minlength="3" autocomplete="username" required>
          <label for="reg-password">รหัสผ่าน</label>
          <input id="reg-password" name="password" type="password" minlength="6" autocomplete="new-password" required>
          <label for="reg-confirm-password">ยืนยันรหัสผ่าน</label>
          <input id="reg-confirm-password" name="confirmPassword" type="password" minlength="6" autocomplete="new-password" required>
          <p class="form-message" id="register-message" role="alert"></p>
          <button class="btn-primary" type="submit">
            <span class="btn-text">สร้างบัญชี</span>
          </button>
        </form>
      </div>
    </section>
  </main>

  <!-- auth.js เป็น entry point และจะ initialize เฉพาะเมื่อพบฟอร์มของหน้านี้ -->
  <script type="module">
    import './js/shared.js';
    import './js/auth.js';
  </script>
</body>
</html>
