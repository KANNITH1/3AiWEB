<!--
  ==========================================
  forgot-password.html - หน้าเตรียมกู้คืนรหัสผ่าน
  ==========================================
  หน้าที่: แสดงฟอร์ม recovery สำหรับเชื่อมต่อ backend ในอนาคต
  ต้อง login ก่อนเข้าใช้งาน: ไม่ต้อง
  ใช้ไฟล์ JS: shared.js, auth.js (โหลด utilities; submit ยังเป็น placeholder)
  ==========================================
-->
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลืมรหัสผ่าน - Forge AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="glow glow-1"></div>

  <main class="simple-auth">
    <a href="index.html" class="logo">Forge <span class="grad-text">AI</span></a>

    <!-- ฟอร์ม recovery แบบ static รอเชื่อม endpoint ของ backend -->
    <section class="panel">
      <p class="eyebrow">ACCOUNT RECOVERY</p>
      <h1>ลืมรหัสผ่าน?</h1>
      <p class="muted">หน้านี้เตรียมไว้สำหรับเชื่อมต่อ endpoint recovery ของ backend ในอนาคต</p>

      <form
        class="auth-form"
        onsubmit="event.preventDefault(); document.getElementById('recovery-message').textContent='ระบบจะพร้อมใช้งานเมื่อเชื่อมต่อ Backend';"
      >
        <label for="recovery-email">อีเมลของคุณ</label>
        <input id="recovery-email" type="email" required placeholder="you@example.com">
        <p id="recovery-message" class="form-message success" role="status"></p>
        <button class="btn-primary" type="submit">ส่งลิงก์รีเซ็ต</button>
        <a class="back-link" href="login.html">กลับไปหน้าเข้าสู่ระบบ</a>
      </form>
    </section>
  </main>

  <!-- โหลด shared/auth utilities; หน้านี้ยังไม่เรียก API จริง -->
  <script type="module">
    import './js/shared.js';
    import './js/auth.js';
  </script>
</body>
</html>
