<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Forge AI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- ===== สไตล์เฉพาะสำหรับกล่องแสดงรายละเอียดรูปภาพ ===== -->
    <style>
        /* กล่องรายละเอียดรูป (เปิดตอนคลิกรูปในแกลเลอรี่) */
        .detail-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            align-items: center; justify-content: center; padding: 20px; z-index: 50;
        }
        .detail-overlay.open { display: flex; }
        .detail-card {
            background: var(--c-card); border-radius: 20px; max-width: 900px; width: 100%;
            max-height: 90vh; overflow-y: auto; display: flex; flex-wrap: wrap;
        }
        .detail-image { flex: 1 1 320px; background: var(--c-bg); display: flex; align-items: center; justify-content: center; padding: 20px; }
        .detail-image img { max-width: 100%; max-height: 60vh; border-radius: 12px; }
        .detail-info { flex: 1 1 280px; padding: 28px; position: relative; }
        .detail-close { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--c-text-mut); }
        .detail-row { margin-bottom: 16px; }
        .detail-row .label { font-size: 12px; font-weight: 700; color: var(--c-text-mut); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .detail-row .value { font-size: 14px; word-break: break-word; }
        .detail-row .value.empty { color: var(--c-text-mut); font-style: italic; }
        .gallery-card { cursor: pointer; }
        .gallery-card:hover { outline: 2px solid var(--primary); }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- ===== แถบเมนูด้านข้าง (Sidebar) ===== -->
        <aside class="sidebar">
            <div class="brand"><h1>Forge <span>AI</span></h1></div>
            <!-- เมนูนำทางไปหน้าต่างๆ -->
            <nav class="nav-menu">
                <a href="home.html" class="nav-item"><span class="icon">🎨</span><span>สร้างภาพ</span></a>
                <a href="gallery.html" class="nav-item active"><span class="icon">🖼️</span><span>แกลเลอรี่</span></a>
            </nav>
            <!-- ข้อมูลโปรไฟล์ผู้ใช้และปุ่มออกจากระบบ -->
            <div class="user-profile">
                <div class="avatar-placeholder">--</div>
                <div class="user-info">
                    <span class="user-name">—</span>
                    <span class="user-id"></span>
                </div>
                <a href="#" onclick="logout(); return false;" class="logout-btn" title="ออกจากระบบ"><span class="icon">🚪</span></a>
            </div>
        </aside>

        <!-- ===== พื้นที่แสดงแกลเลอรี่รูปภาพ ===== -->
        <main class="main-content">
            <!-- หัวข้อหน้าแกลเลอรี่ -->
            <header class="page-header">
                <span class="badge-subtitle">MY GALLERY</span>
                <h2>Image <span class="highlight">Gallery</span></h2>
                <p>ภาพทั้งหมดที่คุณเคยสร้างและบันทึกไว้</p>
            </header>
            <!-- กล่องบรรจุรายการการ์ดรูปภาพทั้งหมด -->
            <div class="content-container" id="gallery-container">
                <p style="color:var(--c-text-mut);">กำลังโหลด...</p>
            </div>
        </main>
    </div>

    <!-- ===== กล่องป๊อปอัปรายละเอียดรูปภาพ (Modal) ===== -->
    <div class="detail-overlay" id="detail-overlay" onclick="if(event.target===this) closeDetail()">
        <div class="detail-card">
            <!-- แสดงรูปภาพขนาดใหญ่ -->
            <div class="detail-image"><img id="detail-img" src="" alt=""></div>
            <!-- แสดงข้อมูลพารามิเตอร์ของภาพ -->
            <div class="detail-info">
                <button class="detail-close" onclick="closeDetail()">✕</button>
                <div class="detail-row"><div class="label">โหมด</div><div class="value" id="detail-mode"></div></div>
                <div class="detail-row"><div class="label">Prompt</div><div class="value" id="detail-prompt"></div></div>
                <div class="detail-row"><div class="label">Negative Prompt</div><div class="value" id="detail-negative"></div></div>
                <div class="detail-row"><div class="label">Model</div><div class="value" id="detail-model"></div></div>
                <div class="detail-row"><div class="label">Seed</div><div class="value" id="detail-seed"></div></div>
                <div class="detail-row"><div class="label">บันทึกเมื่อ</div><div class="value" id="detail-date"></div></div>
                <button class="primary-btn" style="background:#ef4444;" id="detail-delete-btn">ลบรูปนี้</button>
            </div>
        </div>
    </div>

    <!-- ===== สคริปต์โหลดและจัดการแกลเลอรี่ ===== -->
    <script src="config.js"></script>
    <script src="script.js"></script>
    <script>
        // รายการรูปภาพทั้งหมดที่ดึงมาจากเซิร์ฟเวอร์
        let galleryItems = [];
        
        // ปิดหน้าต่างรายละเอียดรูปภาพ
        const closeDetail = () => $('detail-overlay').classList.remove('open');

        // แสดงค่าในช่องรายละเอียด (ถ้าไม่มีค่าจะแสดงเครื่องหมายขีด)
        function setField(id, value) {
            const empty = value === null || value === undefined || value === '';
            $(id).textContent = empty ? '—' : value;
            $(id).classList.toggle('empty', empty);
        }

        // เปิดหน้าต่างรายละเอียดเมื่อคลิกการ์ดรูปภาพ
        function openDetail(id) {
            const item = galleryItems.find(g => g.id === id);
            if (!item) return;
            $('detail-img').src = item.image_url;
            Object.entries({
                mode: (item.mode || '').toUpperCase(), prompt: item.prompt, negative: item.negative_prompt,
                model: item.model, seed: item.seed, date: new Date(item.created_at).toLocaleString('th-TH'),
            }).forEach(([key, value]) => setField(`detail-${key}`, value));
            $('detail-delete-btn').onclick = () => removeImage(item.id);
            $('detail-overlay').classList.add('open');
        }

        // โหลดรายการรูปภาพทั้งหมดของผู้ใช้จาก Backend
        async function loadGallery() {
            try {
                galleryItems = (await api('/api/gallery')).items || [];
                render();
            } catch (err) {
                if (err.status === 401) return;   // api() พาไปหน้า login แล้ว
                $('gallery-container').innerHTML = `<div class="form-card" style="text-align:center; padding:40px;">
                    <p style="color:#ef4444;">โหลดแกลเลอรี่ไม่สำเร็จ: ${err.message}</p>
                    <p style="color:var(--c-text-mut); font-size:13px;">ตรวจสอบว่า server.py และ auth.py รันอยู่หรือไม่</p>
                </div>`;
            }
        }

        // วาดการ์ดรูปภาพทั้งหมดลงในหน้าเว็บ
        function render() {
            $('gallery-container').innerHTML = galleryItems.length === 0 ? `
                <div class="form-card" style="text-align:center; padding:60px 20px;">
                    <span style="font-size:40px; margin-bottom:15px; display:block;">📂</span>
                    <h3 style="margin-bottom:10px;">ยังไม่มีภาพที่บันทึกไว้</h3>
                    <p style="color:var(--c-text-mut); font-size:14px;">ภาพที่คุณกดถูกใจ (🤍) ในหน้า "สร้างภาพ" จะมาปรากฏที่นี่</p>
                    <br>
                    <a href="home.html" class="secondary-btn" style="text-decoration:none; padding:10px 20px; display:inline-block;">กลับไปสร้างภาพ</a>
                </div>` : `
                <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:20px;">
                    ${galleryItems.map(item => `
                    <div class="form-card gallery-card" style="padding:15px; text-align:center; position:relative;" onclick="openDetail(${item.id})">
                        <img src="${item.image_url}" style="width:100%; border-radius:12px; object-fit:contain; margin-bottom:10px; border:1px solid var(--c-border);">
                        <div style="font-size:12px; color:var(--c-text-mut); display:flex; justify-content:space-between;">
                            <span>โหมด: ${String(item.mode || '-').toUpperCase()}</span>
                            <span>${new Date(item.created_at).toLocaleDateString('th-TH')}</span>
                        </div>
                    </div>`).join('')}
                </div>`;
        }

        // ลบรูปภาพออกจากแกลเลอรี่
        async function removeImage(id) {
            if (!confirm('ลบรูปนี้ออกจากแกลเลอรี่?')) return;
            try {
                await api(`/api/gallery/${id}`, { method: 'DELETE' });
                closeDetail();
                galleryItems = galleryItems.filter(g => g.id !== id);
                render();
            } catch (err) {
                if (err.status !== 401) alert('ลบไม่สำเร็จ: ' + err.message);
            }
        }

        // เริ่มโหลดรูปภาพเมื่อหน้าเว็บพร้อมทำงาน
        document.addEventListener('DOMContentLoaded', loadGallery);
    </script>
</body>
</html>
