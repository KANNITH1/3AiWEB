<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ — Forge AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== กล่องฟอร์มเข้าสู่ระบบ ===== -->
  <div class="auth-layout">
    <div class="form-card auth-card">
      <!-- โลโก้และชื่อระบบ -->
      <div class="brand">
          <h1>Forge <span>AI</span></h1>
      </div>
      <!-- หัวข้อหน้าเข้าสู่ระบบ -->
      <h2 style="margin-bottom: 8px; font-size: 24px; font-weight: 600;">เข้าสู่ระบบ</h2>
      <p style="margin-bottom: 24px; color: var(--c-text-mut); font-size: 14px;">ยินดีต้อนรับกลับสู่ระบบ</p>

      <!-- ฟอร์มกรอกอีเมลและรหัสผ่าน -->
      <form id="login-form" onsubmit="handleLogin(event)" style="text-align: left;"> <!-- เมื่อกด Submit จะเรียกฟังก์ชัน handleLogin(event) เพื่อส่งข้อมูลไปตรวจสอบสิทธิ์ -->
        <!-- ช่องกรอกอีเมล -->
        <div class="form-group">
          <label for="email" class="group-label">อีเมล (Email)</label>
          <input type="email" id="email" placeholder="your@email.com" required> <!-- ช่องกรอกอีเมลสำหรับเข้าสู่ระบบ -->
        </div>

        <!-- ช่องกรอกรหัสผ่าน -->
        <div class="form-group">
          <label for="password" class="group-label">รหัสผ่าน (Password)</label>
          <input type="password" id="password" placeholder="••••••••" required> <!-- ช่องกรอกรหัสผ่านสำหรับเข้าสู่ระบบ -->
        </div>

        <!-- กล่องข้อความแจ้งเตือนเมื่อเข้าสู่ระบบไม่สำเร็จ -->
        <p id="error-message" style="color: #ef4444; font-size: 13px; margin-bottom: 15px; display: none; text-align: center;">อีเมลหรือรหัสผ่านไม่ถูกต้อง</p>

        <!-- ปุ่มกดเพื่อเข้าสู่ระบบ -->
        <button type="submit" class="primary-btn" id="login-btn"> <!-- [ปุ่มกดเข้าสู่ระบบ] ส่งข้อมูลฟอร์มไปยัง API: /api/login หากสำเร็จจะนำทางไปหน้า home.html -->
          เข้าสู่ระบบ
        </button>
      </form>

      <!-- ลิงก์สลับไปหน้าสมัครสมาชิก -->
      <div class="auth-footer">
        ยังไม่มีบัญชีใช่ไหม? <a href="register.html">สมัครสมาชิก</a> <!-- [ลิงก์กด] นำทางไปหน้า: register.html (หน้าสมัครสมาชิก) -->
      </div>
    </div>
  </div>

  <!-- ===== สคริปต์เชื่อมต่อ Backend สำหรับเข้าสู่ระบบ ===== -->
  <script src="config.js"></script> <!-- โหลดการตั้งค่า URL ของ Backend (API_BASE) -->
  <script>
    // ฟังก์ชันย่อสำหรับดึง Element ตาม id
    const $ = id => document.getElementById(id); // คืนค่า Element ตาม id ที่ระบุ

    // ส่งอีเมลและรหัสผ่านไปตรวจสอบที่เซิร์ฟเวอร์ ถ้าผ่านจะเก็บ Token และพาไปหน้าหลัก
    async function handleLogin(e) {
      e.preventDefault(); // ป้องกันหน้าเว็บรีโหลดจากการ submit ฟอร์ม
      const error = $('error-message'), btn = $('login-btn'); // ดึง element แสดง error และปุ่ม submit
      const fail = msg => { error.textContent = msg; error.style.display = 'block'; }; // ฟังก์ชันแสดงข้อความแจ้งเตือน error

      error.style.display = 'none'; // ซ่อนข้อความแจ้งเตือนข้อผิดพลาด
      btn.textContent = 'กำลังตรวจสอบ...'; // เปลี่ยนข้อความปุ่มระหว่างรอผลตรวจสอบ
      btn.style.opacity = '0.7'; // ปรับความโปร่งใสของปุ่มเพื่อสื่อว่ากำลังประมวลผล
      try {
        const res = await fetch(API_BASE + '/api/login', { // ส่งคำขอ POST ไปตรวจสอบสิทธิ์ที่ Backend Endpoint: /api/login
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: $('email').value, password: $('password').value })
        });
        const data = await res.json().catch(() => ({}));
        // ถ้าเข้าสู่ระบบไม่ผ่าน ให้แสดงข้อความแจ้งเตือน
        if (!res.ok || !data.token) return fail(data.error || 'อีเมลหรือรหัสผ่านไม่ถูกต้อง หรือไม่มีข้อมูลในระบบ'); // หากไม่สำเร็จให้แสดง error ทันที

        // บันทึก Token และข้อมูลผู้ใช้ลงเบราว์เซอร์ แล้วย้ายไปหน้าหลัก
        localStorage.setItem('forge_token', data.token); // จัดเก็บ JWT Token ลง localStorage
        localStorage.setItem('forge_user', JSON.stringify(data.user)); // จัดเก็บข้อมูลผู้ใช้ลง localStorage
        window.location.href = 'home.html'; // [จุดนำทางหลัก] ย้ายหน้าเว็บไปยัง: home.html (หน้าหลักสร้างภาพ)
      } catch (err) {
        fail('ไม่สามารถเชื่อมต่อกับระบบฐานข้อมูลได้ (Backend ปิดอยู่)');   // fetch ล้มเหลว = เซิร์ฟเวอร์ไม่ตอบ
      } finally {
        btn.textContent = 'เข้าสู่ระบบ'; // คืนค่าข้อความบนปุ่ม
        btn.style.opacity = '1'; // คืนค่าความโปร่งใสของปุ่ม
      }
    }
  </script>
</body>
</html>
