<!--
  ==========================================
  index.html - Landing page ของ Forge AI
  ==========================================
  หน้าที่: แนะนำระบบและพาผู้ใช้ไปหน้า login หรือ about
  ต้อง login ก่อนเข้าใช้งาน: ไม่ต้อง; auth.js จะ redirect ผู้ใช้ที่ login แล้ว
  ใช้ไฟล์ JS: shared.js, auth.js
  ==========================================
-->
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forge AI - สร้างภาพด้วย AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="landing-page">
  <!-- พื้นหลังตกแต่งสำหรับ landing page -->
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <!-- เนื้อหาแนะนำระบบและปุ่มนำทาง -->
  <main class="landing-content">
    <p class="eyebrow">AI IMAGE GENERATION PLATFORM</p>
    <h1>Forge <span class="grad-text">AI</span></h1>
    <p class="landing-copy">เปลี่ยนจินตนาการให้เป็นภาพ ด้วยเครื่องมือสร้างสรรค์ที่เรียบง่าย รวดเร็ว และพร้อมต่อยอด</p>

    <!-- ปุ่มเริ่มต้นและปุ่มไปหน้า About -->
    <div class="landing-actions">
      <a class="btn-primary landing-btn" href="login.html">เริ่มต้นใช้งาน</a>
      <a class="action-btn" href="about.html">รู้จัก Forge AI</a>
    </div>

    <div class="landing-features">
      <span>✦ Text to Image</span>
      <span>✦ Image to Image</span>
      <span>✦ Upscale</span>
    </div>
  </main>

  <!-- auth.js ตรวจ token และ redirect ผู้ใช้ที่ login แล้ว -->
  <script type="module">
    import './js/shared.js';
    import { redirectIfAuthenticated } from './js/auth.js';

    redirectIfAuthenticated();
  </script>
</body>
</html>
