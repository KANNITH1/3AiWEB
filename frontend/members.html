<!--
  ==========================================
  members.html - หน้าโปรไฟล์สมาชิก Forge AI
  ==========================================
  หน้าที่: แสดงข้อมูล user แก้ไขชื่อ/รหัสผ่าน และ logout
  ต้อง login ก่อนเข้าใช้งาน: ต้อง login
  ใช้ไฟล์ JS: shared.js, auth.js, members.js
  ==========================================
-->
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Forge AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- พื้นหลังตกแต่งตามธีมหลัก -->
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <!-- Sidebar จะถูก inject โดย shared.js หลัง auth guard ผ่าน -->
  <div class="layout">
    <main class="main-content">
      <!-- หัวข้อหน้า profile -->
      <p class="eyebrow">YOUR WORKSPACE</p>
      <h1>โปรไฟล์ <span class="grad-text">สมาชิก</span></h1>

      <div class="profile-grid">
        <!-- สรุปข้อมูลผู้ใช้และปุ่ม logout -->
        <section class="panel profile-summary">
          <div class="profile-avatar">F</div>
          <h2 id="profile-username">Forge Member</h2>
          <p id="profile-email" class="muted">user@forge.ai</p>
          <p class="muted">สมัครสมาชิกเมื่อ <span id="profile-date">-</span></p>
          <button id="profile-logout" class="logout-btn" type="button">ออกจากระบบ</button>
        </section>

        <!-- ฟอร์มแก้ไข username และเปลี่ยน password ควบคุมโดย members.js -->
        <section class="panel">
          <h2>แก้ไขข้อมูล</h2>
          <form id="profile-form" class="auth-form">
            <label for="profile-edit-username">ชื่อผู้ใช้</label>
            <input id="profile-edit-username" minlength="3" placeholder="ชื่อผู้ใช้ใหม่">
            <button class="btn-primary" type="submit">บันทึกข้อมูล</button>
          </form>

          <hr>

          <h2>เปลี่ยนรหัสผ่าน</h2>
          <form id="profile-password-form" class="auth-form">
            <label for="profile-new-password">รหัสผ่านใหม่</label>
            <input id="profile-new-password" type="password" minlength="6" required>
            <button class="action-btn" type="submit">เปลี่ยนรหัสผ่าน</button>
          </form>
        </section>

        <!-- สถิติการใช้งานตัวอย่างสำหรับ demo mode -->
        <section class="panel stats-panel">
          <span class="eyebrow">ACTIVITY</span>
          <strong>3</strong>
          <p class="muted">ภาพที่สร้างทั้งหมด (Demo)</p>
        </section>
      </div>
    </main>
  </div>

  <!-- Entry point ของหน้า: shared/auth จัดการ shell และ members เติมข้อมูล profile -->
  <script type="module">
    import { injectNavbar } from './js/shared.js';
    import './js/auth.js';
    import { initMembers } from './js/members.js';

    if (injectNavbar()) initMembers();
  </script>
</body>
</html>
